name: 56K
options:
  bundleIdPrefix: com.56k
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: 1
    INFOPLIST_KEY_CFBundleDisplayName: "56K"

targets:
  56K:
    type: application
    platform: iOS
    sources:
      - path: 56K
    settings:
      base:
        INFOPLIST_FILE: 56K/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.56k.calendar
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: 1
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: true
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: true
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: true
        INFOPLIST_KEY_UILaunchScreen_Generation: true
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown"
    entitlements:
      path: 56K/56K.entitlements
    dependencies:
      - target: 56KWidget
        embed: true

  56KWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: ../56KWidget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.56k.calendar.widget
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: 1
        GENERATE_INFOPLIST_FILE: true
        INFOPLIST_KEY_CFBundleDisplayName: "56K Widget"
        INFOPLIST_KEY_NSExtension_NSExtensionPointIdentifier: com.apple.widgetkit-extension

  56KTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ../56KTests
    dependencies:
      - target: 56K
